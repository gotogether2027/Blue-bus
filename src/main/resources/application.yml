spring:
  application:
    name: blue-bus-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bluebus}
    username: ${DB_USERNAME:bluebus}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

blue-bus:
  # Runtime environment marker, independent of Spring profiles. Default local.
  # Production fail-fast applies when this is "production" OR Spring profile `prod` is active.
  # Deployments should set BOTH SPRING_PROFILES_ACTIVE=prod and BLUE_BUS_ENVIRONMENT=production.
  environment: ${BLUE_BUS_ENVIRONMENT:local}
  security:
    jwt:
      issuer: ${JWT_ISSUER:blue-bus}
      # Required: set JWT_SECRET to a value of at least 32 bytes. Never commit production secrets.
      secret: ${JWT_SECRET}
      access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
    refresh:
      # Opaque refresh-token lifetime (default 14 days). Cleanup/reaper deferred.
      ttl-seconds: ${REFRESH_TOKEN_TTL_SECONDS:1209600}
      # Concurrent refresh loser window (seconds). Later replay still revokes the family.
      concurrent-reuse-grace-seconds: ${REFRESH_TOKEN_CONCURRENT_REUSE_GRACE_SECONDS:5}
  seat-holds:
    create:
      # Server-owned hold lifetime. Clients never supply expiresAt.
      ttl-seconds: 600
    expiry:
      enabled: true
      reaper-interval-ms: 30000
      batch-size: 100
  bookings:
    unpaid:
      # Server-owned payment deadline from booking create. Clients never supply paymentExpiresAt.
      ttl-seconds: 900
    expiry:
      enabled: true
      reaper-interval-ms: 30000
      batch-size: 100
  # Historical name. This flag registers the core business API (auth, search, holds,
  # bookings, payments, tickets, operator portal, and admin controllers).
  # /api/v1/health is independent and can still report UP when this is false.
  # Production (profile `prod` or BLUE_BUS_ENVIRONMENT=production) refuses to start if this is false. Do not disable it
  # while the outbox processor is enabled — BOOKING_CONFIRMED ticket handling would be missing.
  admin-master-data:
    enabled: ${BLUE_BUS_ADMIN_MASTER_DATA_ENABLED:true}
  outbox:
    # Enables local outbox processor beans. Independent of the core API flag above;
    # ProductionConfigurationGuard rejects the combination processor-on + API-off.
    enabled: true
    processor:
      # Local DB consumer for BOOKING_CONFIRMED → ticket issuance. RabbitMQ remains deferred.
      enabled: true
      poll-interval-ms: 5000
      batch-size: 50
  payments:
    # Local/test may stay UNCONFIGURED (checkout then returns 503).
    # Production requires PAYMENT_PROVIDER=RAZORPAY plus Razorpay secrets at startup.
    default-provider: ${PAYMENT_PROVIDER:UNCONFIGURED}
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
      base-url: ${RAZORPAY_BASE_URL:https://api.razorpay.com}
    refund-retry:
      enabled: true
      after-commit-enabled: true
      poll-interval-ms: 5000
      batch-size: 50
      lease-ms: 45000
      initial-backoff-ms: 5000
      max-backoff-ms: 900000
    initiating-recovery:
      enabled: true
      poll-interval-ms: 5000
      batch-size: 50
      lease-ms: 45000
      stale-threshold-ms: 30000
      initial-backoff-ms: 5000
      max-backoff-ms: 900000
  cors:
    # Fail-closed: empty list grants no browser CORS headers (same-origin /api/v1 is the
    # supported production SPA model). Never use "*". Split-origin hosting must set
    # explicit origins and require-allowed-origins=true.
    allowed-origins: []
    require-allowed-origins: ${BLUE_BUS_CORS_REQUIRE_ALLOWED_ORIGINS:false}
  demo-data:
    # Local E2E catalog only. Default false. Production refuses to start if this is true.
    # Also refused when PAYMENT_PROVIDER=RAZORPAY, even outside production.
    enabled: ${DEMO_DATA_ENABLED:false}
    customer-email: ${DEMO_CUSTOMER_EMAIL:demo.customer@example.test}
    # Required when enabled. Supply via environment — do not commit a password.
    customer-password: ${DEMO_CUSTOMER_PASSWORD:}

logging:
  level:
    org.springframework.security: WARN
