spring:
  application:
    name: blue-bus-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bluebus}
    username: ${DB_USERNAME:bluebus}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

blue-bus:
  security:
    jwt:
      issuer: ${JWT_ISSUER:blue-bus}
      # Required: set JWT_SECRET to a value of at least 32 bytes. Never commit production secrets.
      secret: ${JWT_SECRET}
      access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
    refresh:
      # Opaque refresh-token lifetime (default 14 days). Cleanup/reaper deferred.
      ttl-seconds: ${REFRESH_TOKEN_TTL_SECONDS:1209600}
      # Concurrent refresh loser window (seconds). Later replay still revokes the family.
      concurrent-reuse-grace-seconds: ${REFRESH_TOKEN_CONCURRENT_REUSE_GRACE_SECONDS:5}
  seat-holds:
    create:
      # Server-owned hold lifetime. Clients never supply expiresAt.
      ttl-seconds: 600
    expiry:
      enabled: true
      reaper-interval-ms: 30000
      batch-size: 100
  bookings:
    unpaid:
      # Server-owned payment deadline from booking create. Clients never supply paymentExpiresAt.
      ttl-seconds: 900
    expiry:
      enabled: true
      reaper-interval-ms: 30000
      batch-size: 100
  payments:
    # Set PAYMENT_PROVIDER=RAZORPAY and supply Razorpay environment secrets to enable checkout.
    default-provider: ${PAYMENT_PROVIDER:UNCONFIGURED}
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
      base-url: ${RAZORPAY_BASE_URL:https://api.razorpay.com}

logging:
  level:
    org.springframework.security: WARN
