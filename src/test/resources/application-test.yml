spring:
  application:
    name: blue-bus-backend-test
  main:
    banner-mode: "off"

blue-bus:
  security:
    jwt:
      issuer: test-issuer
      # Test-only HS256 secret (>= 32 bytes). Not for production use.
      secret: test-only-placeholder-not-a-secret!!
      access-token-ttl-seconds: 900
    refresh:
      ttl-seconds: 1209600
      concurrent-reuse-grace-seconds: 5
  seat-holds:
    expiry:
      enabled: false
      reaper-interval-ms: 60000
      batch-size: 50
  bookings:
    unpaid:
      ttl-seconds: 900
    expiry:
      enabled: false
      reaper-interval-ms: 30000
      batch-size: 50
