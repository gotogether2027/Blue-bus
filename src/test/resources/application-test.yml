spring:
  application:
    name: blue-bus-backend-test
  main:
    banner-mode: "off"

blue-bus:
  environment: test
  security:
    jwt:
      issuer: test-issuer
      # Test-only HS256 secret (>= 32 bytes). Not for production use.
      secret: test-only-placeholder-not-a-secret!!
      access-token-ttl-seconds: 900
    refresh:
      ttl-seconds: 1209600
      concurrent-reuse-grace-seconds: 5
  seat-holds:
    expiry:
      enabled: false
      reaper-interval-ms: 60000
      batch-size: 50
  bookings:
    unpaid:
      ttl-seconds: 900
    expiry:
      enabled: false
      reaper-interval-ms: 30000
      batch-size: 50
  outbox:
    enabled: true
    processor:
      enabled: false
      poll-interval-ms: 5000
      batch-size: 50
  payments:
    refund-retry:
      enabled: false
      after-commit-enabled: true
      poll-interval-ms: 5000
      batch-size: 50
      lease-ms: 45000
      initial-backoff-ms: 5000
      max-backoff-ms: 900000
    initiating-recovery:
      enabled: false
      poll-interval-ms: 5000
      batch-size: 50
      lease-ms: 45000
      stale-threshold-ms: 30000
      initial-backoff-ms: 5000
      max-backoff-ms: 900000
  cors:
    allowed-origins:
      - http://localhost:4200
  demo-data:
    # Tests must opt in explicitly. Never seed the shared catalog by default.
    enabled: false
