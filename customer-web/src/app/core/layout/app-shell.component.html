<div class="shell">
  @if (loading.active()) {
    <div class="progress" aria-hidden="true"></div>
  }
  <header class="topbar customer-topbar">
    <a routerLink="/" class="brand">BLUE BUS</a>
    <button
      class="menu-toggle"
      type="button"
      (click)="menuOpen = !menuOpen"
      aria-controls="customer-nav"
      [attr.aria-expanded]="menuOpen"
      [attr.aria-label]="menuOpen ? 'Close menu' : 'Open menu'"
    >
      Menu
    </button>
    <nav id="customer-nav" class="nav" [class.open]="menuOpen" aria-label="Customer">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
      <a routerLink="/bookings" routerLinkActive="active">My Bookings</a>
      <a routerLink="/profile" routerLinkActive="active">Profile</a>
      @if (auth.isAuthenticated()) {
        @if (operatorContext.memberships().length > 0) {
          <a routerLink="/operator" routerLinkActive="active">Operator portal</a>
        }
        <span class="nav-user">{{ auth.currentUser()?.firstName }}</span>
        <button type="button" class="link-button" (click)="logout()">Logout</button>
      } @else {
        <a routerLink="/login" routerLinkActive="active">Login</a>
        <a routerLink="/register" class="btn btn-small">Register</a>
      }
    </nav>
  </header>
  <main class="main">
    <router-outlet />
  </main>
  <footer class="footer customer-footer">
    <p>BLUE BUS · Andhra Pradesh &amp; Telangana</p>
    <nav class="footer-nav" aria-label="Footer">
      <a routerLink="/">Home</a>
      <a routerLink="/bookings">My Bookings</a>
      <a routerLink="/profile">Profile</a>
    </nav>
  </footer>
</div>
